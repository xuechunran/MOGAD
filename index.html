<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOGAD 1年不完全恢复风险评分</title>
<style>
  :root{
    --bg:#f2f5f9; --card:#ffffff; --line:#e2e8f0;
    --text:#1e293b; --muted:#64748b; --accent:#2563eb;
    --low:#16a34a; --mid:#f59e0b; --high:#dc2626;
  }
  *{box-sizing:border-box}
  body{
    margin:0;padding:28px 16px;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.6;
  }
  .wrap{max-width:820px;margin:0 auto}
  h1{font-size:21px;margin:0 0 6px;line-height:1.4}
  .sub{color:var(--muted);font-size:13px;margin-bottom:22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:18px}
  .field{margin-bottom:20px}
  .field:last-child{margin-bottom:0}
  .field label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
  .field .hint{color:var(--muted);font-weight:400;font-size:12.5px}
  input[type=number]{
    width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;
    font-size:16px;background:#fff;color:inherit;
  }
  input:focus{outline:2px solid rgba(37,99,235,.25);border-color:var(--accent)}
  .radio-group{display:flex;gap:10px;flex-wrap:wrap}
  .radio-group label{
    flex:1;min-width:110px;display:flex;align-items:center;justify-content:center;gap:8px;
    padding:11px;border:1px solid var(--line);border-radius:9px;cursor:pointer;
    font-weight:500;font-size:14.5px;background:#fff;transition:.15s;
  }
  .radio-group input{accent-color:var(--accent);width:16px;height:16px}
  .radio-group label:has(input:checked){
    border-color:var(--accent);background:#eff6ff;color:var(--accent);font-weight:600;
  }
  button{
    width:100%;padding:13px;border:0;border-radius:10px;background:var(--accent);
    color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin-top:4px;
  }
  button:hover{background:#1d4ed8}
  button.ghost{background:#fff;color:var(--muted);border:1px solid var(--line);font-weight:500;font-size:14px;padding:10px;margin-top:10px}
  button.ghost:hover{background:#f8fafc}
  .result-card{text-align:center}
  .placeholder{color:var(--muted);font-size:14px;padding:36px 0}
  .total-score{font-size:52px;font-weight:800;line-height:1;margin:8px 0 4px;font-variant-numeric:tabular-nums}
  .total-score small{font-size:18px;font-weight:600;color:var(--muted);margin-left:4px}
  .badge{display:inline-block;padding:7px 22px;border-radius:999px;color:#fff;font-weight:700;font-size:17px;letter-spacing:.5px}
  .freq{margin-top:14px;font-size:14.5px;color:#334155;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .freq strong{color:var(--text)}
  .breakdown{margin-top:22px;text-align:left;font-size:13.5px}
  .breakdown h3{font-size:13px;color:var(--muted);margin:0 0 10px;font-weight:600;letter-spacing:.3px}
  .breakdown .row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
  .breakdown .row:last-child{border-bottom:0}
  .breakdown .row .name{color:#475569}
  .breakdown .row .pts{font-weight:700;font-variant-numeric:tabular-nums}
  .pts-pos{color:var(--high)}
  .pts-zero{color:var(--muted)}
  .disclaimer{margin-top:20px;font-size:11.5px;color:#94a3b8;line-height:1.6;text-align:left}
  @media(max-width:520px){ .total-score{font-size:44px} h1{font-size:18px} }
</style>
</head>
<body>
<div class="wrap">
  <h1>MOGAD 急性发作后 1 年不完全恢复风险评分</h1>
  <p class="sub">Scoring system for predicting incomplete recovery at 1 year after acute attack in MOGAD patients</p>

  <!-- 输入区 -->
  <div class="card" id="inputCard">
    <div class="field">
      <label for="plt">血小板计数 PLT <span class="hint">(×10⁹/L)</span></label>
      <input type="number" id="plt" step="0.01" min="0" placeholder="例如 230">
    </div>

    <div class="field">
      <label for="age">年龄 Age <span class="hint">(岁)</span></label>
      <input type="number" id="age" step="0.1" min="0" placeholder="例如 40">
    </div>

    <div class="field">
      <label>脑干受累 Brainstem involvement</label>
      <div class="radio-group">
        <label><input type="radio" name="brainstem" value="0" checked> 无 (Absent)</label>
        <label><input type="radio" name="brainstem" value="1"> 有 (Present)</label>
      </div>
    </div>

    <button type="button" id="calcBtn">计算评分与风险</button>
    <button type="button" class="ghost" id="resetBtn">重置</button>
  </div>

  <!-- 结果区 -->
  <div class="card result-card" id="resultCard">
    <div class="placeholder">填写上方指标后点击「计算评分与风险」</div>
  </div>
</div>

<script>
/* =========================================================
   评分规则（严格依据 Table 2）
   ========================================================= */
function scorePLT(v){
  if (v <= 208.33) return 4;
  if (v <= 266.00) return 2;
  return 0;
}
function scoreAge(v){
  if (v <= 32.3) return 0;
  if (v <= 48.3) return 2;
  return 4;
}
function scoreBrainstem(v){   // 1 = Present, 0 = Absent
  return v === 1 ? 5 : 0;
}

/* 风险分级（依据原文 development cohort 频率） */
const GRADES = [
  { min:0,  max:2,  level:"低危",       color:"var(--low)",  rate:"9.1% (1/11)"  },
  { min:3,  max:7,  level:"中危",       color:"var(--mid)",  rate:"64.3% (9/14)" },
  { min:8,  max:13, level:"高危",       color:"var(--high)", rate:"80.0% (8/10)" }
];
function gradeOf(score){
  return GRADES.find(g => score >= g.min && score <= g.max) || GRADES[GRADES.length-1];
}

/* =========================================================
   计算与渲染
   ========================================================= */
const $ = s => document.querySelector(s);

function compute(){
  const pltRaw = $("#plt").value.trim();
  const ageRaw = $("#age").value.trim();
  const bsRaw  = document.querySelector('input[name="brainstem"]:checked').value;

  // 空值检查（不自动填充默认值）
  if (pltRaw === "" || ageRaw === "") {
    return { error: "请填写血小板计数和年龄。" };
  }
  const plt = parseFloat(pltRaw);
  const age = parseFloat(ageRaw);
  if (Number.isNaN(plt) || Number.isNaN(age) || plt < 0 || age < 0) {
    return { error: "请输入有效的非负数值。" };
  }

  const bs = parseInt(bsRaw, 10);

  const sPLT = scorePLT(plt);
  const sAge = scoreAge(age);
  const sBS  = scoreBrainstem(bs);
  const total = sPLT + sAge + sBS;

  return {
    total,
    items: [
      { name: `血小板 PLT = ${plt} ×10⁹/L`, pts: sPLT },
      { name: `年龄 = ${age} 岁`,             pts: sAge },
      { name: `脑干受累 = ${bs === 1 ? "有" : "无"}`, pts: sBS }
    ]
  };
}

function render(){
  const r = compute();
  const box = $("#resultCard");

  if (r.error){
    box.innerHTML = `<div class="placeholder" style="color:#dc2626">${r.error}</div>`;
    return;
  }

  const g = gradeOf(r.total);

  const rows = r.items.map(it => `
    <div class="row">
      <span class="name">${it.name}</span>
      <span class="pts ${it.pts > 0 ? "pts-pos" : "pts-zero"}">${it.pts > 0 ? "+" : ""}${it.pts} 分</span>
    </div>`).join("");

  box.innerHTML = `
    <div style="font-size:13px;color:var(--muted);letter-spacing:.5px">总 分</div>
    <div class="total-score">${r.total}<small>分</small></div>
    <div style="margin:10px 0 4px">
      <span class="badge" style="background:${g.color}">${g.level}</span>
    </div>
    <div class="freq">
      该组别 1 年不完全恢复的观察频率：<strong>${g.rate}</strong>
    </div>

    <div class="breakdown">
      <h3>评分明细</h3>
      ${rows}
    </div>

    <div class="disclaimer">
      本工具仅供科研与临床参考，不能替代医师的个体化判断。
      模型来源于特定队列，仍需要外部队列进一步验证。
    </div>
  `;
}

/* 事件绑定 */
$("#calcBtn").addEventListener("click", render);
$("#resetBtn").addEventListener("click", () => {
  // 重置输入框为空，脑干默认选择“无”，结果区恢复为提示状态
  $("#plt").value = "";
  $("#age").value = "";
  document.querySelector('input[name="brainstem"][value="0"]').checked = true;
  $("#resultCard").innerHTML = `<div class="placeholder">填写上方指标后点击「计算评分与风险」</div>`;
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); render(); }
});

/* 页面加载时不计算、不填充默认值，仅保留占位提示 */
</script>
</body>
</html>
